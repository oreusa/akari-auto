name: probe（ページが開けるかの調べ・投稿しない）
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "空白で区切ったURL"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          URLS: ${{ inputs.urls }}
        run: python3 scripts/probe.py $URLS
