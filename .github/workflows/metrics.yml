name: metrics（数字係・毎晩0:45）
on:
  schedule:
    - cron: "45 15 * * *"  # 夜0:45（10/26 オーナー「月とそろえたい」。前の日と2日前を取る）
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: akari-state
  cancel-in-progress: false
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
      COMMIT_MSG: "数字係の記録"
    steps:
      - uses: actions/checkout@v4
      - name: 数字を取る
        run: python3 scripts/metrics.py
      - name: HPの在庫を数える（notes/stock.md。足りない都県・終わった物・開けないリンク）
        run: python3 scripts/stock.py || true
      - name: 当たり帳を作る（notes/scoreboard.md）
        run: python3 scripts/scoreboard.py || true
      - name: フォロワー数を記録（data/followers.json）
        run: python3 scripts/followers.py || true
      - name: GitHubの分数を数える（notes/actions-minutes.md）
        run: python3 scripts/minutes.py || true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 記録を保存
        run: |
          git config user.name "akari-auto"
          git config user.email "akari-auto@users.noreply.github.com"
          for p in state log data notes/scoreboard.md notes/actions-minutes.md notes/stock.md config.json; do [ -e "$p" ] && git add -A "$p"; done || true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "$COMMIT_MSG"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
