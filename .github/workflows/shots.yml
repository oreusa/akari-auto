name: shots（公開中のページをスマホの幅で撮って shots ブランチに置く。月が本番の見た目を確かめる用・手で動かす）
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "撮るページ（スペース区切り）"
        required: true
        default: "https://usagi-life-notes.pages.dev/okaimono https://townnote.pages.dev/okaimono"
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: この枝の site を手元で見せる（見本用 http://localhost:8080/）
        run: (cd site && nohup python3 -m http.server 8080 >/dev/null 2>&1 &) ; sleep 2
      - name: 撮る（昼・夜、上から4画面ずつ）
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y -q >/dev/null && npm i -q playwright@1.47.2 && npx playwright install --with-deps chromium >/dev/null
          mkdir -p /tmp/out
          cat > s.js <<'EOF'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();const urls=process.env.URLS.split(/\s+/).filter(Boolean);let i=0;
          for(const u of urls){i++;for(const mode of ['day','night']){const c=await b.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,colorScheme:mode==='night'?'dark':'light'});const p=await c.newPage();
          try{await p.goto(u,{waitUntil:'networkidle',timeout:45000});}catch(e){console.log('goto',u,e.message);}
          await p.waitForTimeout(2500);
          if(mode==='night'){await p.evaluate(()=>{const t=document.getElementById('utheme');if(t&&!document.documentElement.classList.contains('night'))t.click();});await p.waitForTimeout(1200);}
          const h=await p.evaluate(()=>document.documentElement.scrollHeight);
          for(let k=0;k<4&&k*780<h;k++){await p.evaluate(y=>scrollTo(0,y),k*780);await p.waitForTimeout(600);await p.screenshot({path:`/tmp/out/${String(i).padStart(2,'0')}-${mode}-${k}.png`});}
          await c.close();}}
          require('fs').writeFileSync('/tmp/out/urls.txt',urls.map((u,j)=>String(j+1).padStart(2,'0')+' '+u).join('\n'));
          await b.close();})();
          EOF
          node s.js
          i=0; for u in $URLS; do i=$((i+1)); curl -sL "$u" -o "/tmp/out/$(printf %02d $i).html" || true; done
      - name: shots ブランチに置く
        run: |
          cd /tmp/out
          git init -q && git checkout -q -b shots
          git config user.name "shots-bot" && git config user.email "shots-bot@users.noreply.github.com"
          git add -A && git commit -qm "shots $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shots
