name: aizukan（AIタイプ図鑑を消す・1回だけ）
# 11/16 22:40 オーナー「それはもうやらない消せ」→ Cloudflare Pages の ai-type-zukan と KV「aizukan-stats」を消す。
# 消えたのを確かめたら、このファイルも消す。
on:
  push:
    branches: [claude/project-thread-xat8xv]
    paths: ['.github/workflows/aizukan.yml']
permissions:
  contents: read
jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CI: "true"
    steps:
      - name: Pages の公開先を消す
        run: |
          W="npx -y wrangler@3.80.0"
          $W pages project delete ai-type-zukan --yes 2>&1 | tail -5 || true
          echo "--- 残っている Pages"
          $W pages project list 2>&1 | grep -c ai-type-zukan || true
      - name: 数える場所（KV aizukan-stats だけ）を消す
        run: |
          W="npx -y wrangler@3.80.0"
          ns=$($W kv namespace list 2>/dev/null | python3 -c 'import sys,json;t=sys.stdin.read();i=t.find("[");a=json.loads(t[i:]) if i>=0 else [];print(next((x["id"] for x in a if x.get("title","").endswith("aizukan-stats")),""))' || true)
          if [ -n "$ns" ]; then $W kv namespace delete --namespace-id "$ns" 2>&1 | tail -3 || true; else echo "KV なし"; fi
          echo "--- 残っている aizukan の KV"
          $W kv namespace list 2>/dev/null | grep -c aizukan-stats || true
      - name: 本番が消えたか確かめる
        run: |
          sleep 20
          code=$(curl -s -o /dev/null -w '%{http_code}' https://ai-type-zukan.pages.dev/ || true)
          echo "https://ai-type-zukan.pages.dev/ → $code"
