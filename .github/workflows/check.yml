name: check（予定表の機械チェック）
on:
  push:
    # 10/29 直近7日で check が1日89分（全体の6割）。作業ブランチと、check に関係ない scripts の変更でも動いていたため、
    # main だけ・予定表と商品とおでかけ・check が使う scripts だけにした
    branches: [main]
    paths: ["schedule/**", "data/page-goods.json", "data/page-spots.json", "scripts/check.py", "scripts/lib.py", "scripts/selftest.py"]
  workflow_dispatch:
concurrency:  # 同じブランチに続けて保存したら、古い方のチェックは止めて新しい方だけ見る（分数の節約）
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - name: 絵を切る道具（Pillow）
        run: python3 -m pip install -q pillow
      - name: 自己テスト
        run: python3 scripts/selftest.py
      - name: 予定表の決まりと、楽天の商品・出どころのページ（前の夜のうちに確かめる）
        run: python3 scripts/check.py --online
