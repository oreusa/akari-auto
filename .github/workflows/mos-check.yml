name: mos-check（申し込みの控えが届いたか数えるだけ）
# 11/9 業者さまの「送信」が数えられたのに、オーナーのメールに届いていない → 控え（KV）に入ったかを確かめる。個人の情報はログに出さない。
on:
  workflow_dispatch:
    inputs:
      day:
        description: "日付（空なら今日）"
        required: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 scripts/mos_check.py ${{ inputs.day }}
