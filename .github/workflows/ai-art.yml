name: ai-art
# リール用の絵を Cloudflare Workers AI（無料枠）で描く。claude/** の枝で tools/ai-art/req-*.json を押した時。結果は shots/ai-art/<名前>/
on:
  push:
    branches: ['claude/**']
    paths: ['tools/ai-art/req-*.json']
permissions:
  contents: write
jobs:
  art:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for R in $(git diff --name-only HEAD~1 HEAD -- 'tools/ai-art/req-*.json'); do N=$(basename "$R" .json); N=${N#req-}; python3 tools/ai-art/cf_gen.py "$R" "shots/ai-art/$N" || true; done
      - run: |
          git config user.name "art bot"; git config user.email "actions@users.noreply.github.com"
          git add shots/ai-art; git diff --cached --quiet || git commit -m "[CF-Pages-Skip] ai-art: 絵"
          for i in 1 2 3; do git pull --rebase -q origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done
