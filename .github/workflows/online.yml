name: online（Bufferに「出たか」を聞けるかの確認・投稿しない）
on:
  workflow_dispatch:
    inputs:
      image:
        description: "4コマの絵のURL（入れると、その絵でBufferの下書きを作れるか試し、すぐ消す）"
        required: false
        default: ""
jobs:
  sent:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/book.py --sent-test
      - if: ${{ inputs.image != '' }}
        env:
          IMAGE: ${{ inputs.image }}
        run: python3 scripts/book.py --koma4-test "$IMAGE"
