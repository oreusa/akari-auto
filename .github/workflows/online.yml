name: online（Bufferに「出たか」を聞けるかの確認・投稿しない）
on:
  workflow_dispatch:
    inputs:
      image:
        description: "4コマの絵のURL（入れると、その絵でBufferの下書きを作れるか試し、すぐ消す）"
        required: false
        default: ""
      reel:
        description: "yes にすると、その絵でリールを作って置けるかも試す（投稿しない）"
        required: false
        default: ""
jobs:
  sent:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 絵を切る道具（Pillow）
        run: python3 -m pip install -q pillow
      - run: python3 scripts/book.py --sent-test
      - if: ${{ inputs.image != '' }}
        env:
          IMAGE: ${{ inputs.image }}
        run: python3 scripts/book.py --koma4-test "$IMAGE"
      - if: ${{ inputs.image != '' && inputs.reel == 'yes' }}
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 scripts/reel.py --test "$IMAGE"
