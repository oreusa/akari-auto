name: townnotes-geo（地図の試作：カードの場所を調べる・この枝だけ）
# 関東おでかけリストの地図の試作用。月が作業の枝で場所を確かめるときだけ動く（main では動かない）
on:
  push:
    branches: [claude/project-thread-fofi9q]
    paths: [scripts/townnotes.py, .github/workflows/townnotes-geo.yml]
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/page.py >/dev/null && python3 scripts/townnotes.py
      - run: |
          git config user.name "akari-auto"
          git config user.email "akari-auto@users.noreply.github.com"
          git add -f data/townnotes-geo.json site/townnotes/geo.json
          git diff --cached --quiet || (git commit -m "地図の試作：カードの場所" && git push)
