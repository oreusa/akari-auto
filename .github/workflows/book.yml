name: book（予約係・2時間おき）
on:
  schedule:
    # GitHub の時刻起動は混むと何時間も飛ぶ（10/23 朝は4時間あいた）ので、12時間先まで予約して取りこぼさない。
    # 非公開リポジトリの無料枠は月2,000分（月と合算・1回1分）。10/25 から2時間おき＋朝の4コマの時間だけ30分おき（1日15回・月約450分）。
    # 出なかった投稿の出し直しは3時間以内なので、2時間おきでも間に合う。
    - cron: "7 0,2,4,6,8,10,12,14,15 * * *"   # 9:07・11:07 … 23:07・0:07（日本時間）
    - cron: "7 18,20 * * *"                   # 3:07・5:07（6時台が飛ばされても7:15・9:15を先に予約する）
    - cron: "7,37 21,22,23 * * *"             # 朝6:07〜8:37 は30分おき（4コマを8:00に間に合わせる）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: akari-state
  cancel-in-progress: false
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
      COMMIT_MSG: "予約係の記録"
      LEAD_MIN: "720"
    steps:
      - uses: actions/checkout@v4
      - name: 絵を切る道具（Pillow）
        run: python3 -m pip install -q pillow
      - name: 雫の動画を確かめる（4コマの日だけ。大きさ・長さ・音の大きさ・最後の絵。10/24から）
        run: |
          if [ "$(python3 scripts/videocheck.py --need)" != "yes" ]; then echo "確かめる動画なし"; exit 0; fi
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 scripts/videocheck.py
      - name: 予約
        run: python3 scripts/book.py
      - name: インスタのリールを直接（曲つき）出す（10/28〜。config の ig_direct と ig/page_token.enc がある時だけ）
        env:
          APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          if [ ! -f ig/page_token.enc ] || [ -z "${APP_SECRET:-}" ]; then echo "直接投稿は未設定"; exit 0; fi
          IG_PAGE_TOKEN=$(openssl enc -d -aes-256-cbc -pbkdf2 -a -pass env:APP_SECRET -in ig/page_token.enc)
          echo "::add-mask::$IG_PAGE_TOKEN"
          IG_PAGE_TOKEN="$IG_PAGE_TOKEN" python3 scripts/igreel.py
      - name: 数字係の代わり（夜0:45の数字係が朝7:15までに動いていない朝だけ。GitHub の時刻起動は2〜3時間遅れることがある。10/25）
        run: |
          y=$(TZ=Asia/Tokyo date -d yesterday +%F); t=$(TZ=Asia/Tokyo date +%F); h=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$h" -lt 0715 ] || [ "$h" -gt 1200 ]; then exit 0; fi
          if grep -q "\"fetchedAt\": \"$t" "data/metrics/$y.json" 2>/dev/null; then echo "今朝の数字はもうある"; exit 0; fi
          python3 scripts/metrics.py && (python3 scripts/scoreboard.py || true)
          [ -e notes/scoreboard.md ] && git add notes/scoreboard.md || true
      - name: 記録を保存
        run: |
          git config user.name "akari-auto"
          git config user.email "akari-auto@users.noreply.github.com"
          for p in state log data config.json koma4 ig; do [ -e "$p" ] && git add -A "$p"; done || true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "$COMMIT_MSG"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
