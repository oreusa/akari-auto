name: book（予約係・1時間おき）
on:
  schedule:
    # GitHub の時刻起動は混むと何時間も飛ぶ（10/23 朝は4時間あいた）ので、12時間先まで予約して取りこぼさない。
    # 1時間に1回（10/24〜）：このリポジトリは非公開で、GitHub Actions の無料枠は月2,000分（1回1分で数える）。1時間2回だと予約係だけで月1,440分になるため。朝だけは4コマのため30分おき
    - cron: "7 * * * *"
    - cron: "37 21,22,23 * * *"   # 朝6:37・7:37・8:37 も（4コマを8:00に間に合わせる）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: akari-state
  cancel-in-progress: false
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
      COMMIT_MSG: "予約係の記録"
      LEAD_MIN: "720"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 絵を切る道具（Pillow）
        run: python3 -m pip install -q pillow
      - name: リールを作る（4コマの絵があり、雫の動画が無い日だけ。10/24から）
        run: |
          if [ "$(python3 scripts/reel.py --need)" != "yes" ]; then echo "作らない"; exit 0; fi
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 scripts/reel.py
      - name: 予約
        run: python3 scripts/book.py
      - name: 記録を保存
        run: |
          git config user.name "akari-auto"
          git config user.email "akari-auto@users.noreply.github.com"
          for p in state log data config.json koma4; do [ -e "$p" ] && git add -A "$p"; done || true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "$COMMIT_MSG"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
