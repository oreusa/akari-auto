name: domain
# 11/15 独自ドメイン townnote.app（scripts/domain.py・gate/）。do=status 状態／gate Worker の入口を出す
on:
  workflow_dispatch:
    inputs:
      do:
        description: status / perm / gate / check
        default: status
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/domain.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DO: ${{ github.event.inputs.do }}
      - name: Worker の入口を出す（kansai./kanto./townnote.app）
        if: ${{ github.event.inputs.do == 'gate' }}
        working-directory: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@3.80.0 deploy
      - name: 出した後の状態
        if: ${{ github.event.inputs.do == 'gate' }}
        run: |
          sleep 20
          DO=status python3 scripts/domain.py
          for h in kansai.townnote.app kanto.townnote.app townnote.app; do echo "$h $(curl -s -o /dev/null -w '%{http_code}' https://$h/ || true)"; done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: 開通の確かめ（新しいアドレスの中身・古いアドレスの引っ越し）
        if: ${{ github.event.inputs.do == 'check' }}
        run: |
          for u in https://townnote.app/ https://kansai.townnote.app/ https://kansai.townnote.app/moushikomi https://kanto.townnote.app/ https://kanto.townnote.app/odekake https://townnote.pages.dev/ranking?f=x https://lifenote-kanto.pages.dev/odekake https://usagi-life-notes.pages.dev/; do
            echo "$u → $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$u")"
          done
          for u in https://kansai.townnote.app/ https://kanto.townnote.app/; do
            echo "$u canonical: $(curl -s "$u" | grep -o '<link rel="canonical"[^>]*>' | head -1)"
            echo "$u pages.dev の残り: $(curl -s "$u" | grep -o '[a-z-]*\.pages\.dev' | sort | uniq -c | tr '\n' ' ')"
          done
          curl -s -o /dev/null -w "申し込みの送り先（関西の入口から） %{http_code}\n" -X OPTIONS -H "Origin: https://kansai.townnote.app" https://kanto.townnote.app/moushikomi-send
