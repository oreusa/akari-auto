name: ranking（楽天の売れ筋・毎晩21:30）
on:
  schedule:
    - cron: "30 12 * * *"  # 夜21:30。22:11の夜の回が読む前に作る
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: akari-state
  cancel-in-progress: false
jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - name: 売れ筋を取る（notes/ranking.md）
        run: python3 scripts/ranking.py
      - name: 保存
        run: |
          git config user.name "akari-auto"
          git config user.email "akari-auto@users.noreply.github.com"
          git add notes/ranking.md
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "楽天の売れ筋"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
