name: page（プロフィール用ページを作って公開・1日2回）
on:
  schedule:
    # 10/27 GitHubの分数が11月に2,000分を超えそうなので1日4回→2回（notes/actions-minutes.md の×）。14:13の集め係の分は18:30で出る
    - cron: "30 22 * * *"   # 7:30
    - cron: "30 9 * * *"    # 18:30
    # 11/1 月：楽天お買い物マラソンが始まる 11/4 20:00 のすぐ後にも1回（本当に値下がりした物を開始直後に出す）
    - cron: "40 11 4 11 *"  # 11/4 20:40
  workflow_dispatch:
    inputs:
      reset:
        description: "今日のHPの数を消して0から数え直す"
        type: boolean
        default: false
permissions:
  contents: write   # 数えた数（data/page-stats.json）を保存する
concurrency:
  group: akari-page
  cancel-in-progress: true
jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: LIFE NOTE のアドレスを用意する（11/2 オーナー「3はB」→ lifenote.pages.dev。Cloudflare で決まった本当のアドレスを LIFE_BASE に。作れない時は今のアドレスのまま）
        run: |
          base="https://usagi-life-notes.pages.dev"
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            W="npx -y wrangler@3.80.0"
            $W pages project create lifenote --production-branch=main >/dev/null 2>&1 || true
            d=$($W pages project list 2>/dev/null | grep -o 'lifenote[a-z0-9-]*\.pages\.dev' | head -1 || true)
            # lifenote.pages.dev は他の人が先に使っていて、Cloudflare は lifenote-7b1.pages.dev を付けた（11/2）。
            # 付いたアドレスがちょうど lifenote.pages.dev の時だけ使う。それ以外は今のアドレスのまま（オーナーが名前を決めるまで）
            if [ "$d" = "lifenote.pages.dev" ]; then base="https://$d"; fi
          fi
          echo "LIFE_BASE=$base" >> "$GITHUB_ENV"; echo "アドレス: $base"
      - name: ページを作る（載せる前に、おでかけ・お得のリンクを開いて確かめる）
        run: LINK_GATE=1 python3 scripts/page.py
      - name: 関東イルミネーションのまとめページと、検索用の robots.txt・sitemap.xml（10/31 月からの頼み。失敗してもHPは出す）
        run: python3 scripts/illumi.py || true
      - name: 関東の紅葉ライトアップ（/koyo とイルミのページの紅葉の段。11/2 オーナー「燈のは紅葉作らないのか？」）
        run: python3 scripts/koyo.py || true
      - name: 買いまわりの1,000円ぽっきり（11/1 オーナー「いつになったら売上作るんだ」。楽天の検索で毎回作る。失敗してもHPは出す）
        run: python3 scripts/kaimawari.py || true
      - name: 1個あたりで比べたページ（11/1 オーナー「すごいって思わせないと買われない」。楽天の送料込みを毎回100件以上比べる。失敗してもHPは出す）
        run: python3 scripts/tanka.py || true
      - name: ふるさと納税を寄付1万円あたりで比べたページ（/furusato。11/1 月：12/31までがいちばん売れる時期。失敗してもHPは出す）
        run: python3 scripts/furusato.py || true
      - name: 本当に値下がりした物だけ（/nesage。11/1 オーナー「みんなと同じことをしても出し抜けない」。楽天の毎日の物の値段を毎回記録し、ふだんより本当に下がった物だけ出す。失敗してもHPは出す）
        run: python3 scripts/nesage.py || true
      - name: 地図（カードの場所を緯度経度に → 本番の / と試作 /townnotes/ に「地図で見る」。失敗しても地図なしでページは出す）
        run: python3 scripts/townnotes.py || true
      - name: 月の関西おでかけリストの近くの宿（楽天トラベル・燈のIDを2人で使う 10/31 オーナー。失敗しても燈のHPは出す）
        run: |
          python3 scripts/kansai_yado.py kansai || true
          python3 scripts/kansai_yado.py kanto || true
      - name: 泊まりで行くおでかけ（/tomari。遠いおでかけ＋近くの宿3軒。10/31 オーナー「燈の方も」。失敗してもHPは出す）
        run: python3 scripts/tomari.py || true
      - name: 月と同じ見た目（v2）を本番と見本 /preview-v2 に入れる（10/31 見本、11/1 オーナー「改善してから本番OK」）
        run: python3 scripts/preview_v2.py || true
      - name: LIFE NOTE に分ける（/ 入口・/odekake 関東おでかけリスト・/okaimono くらべたおかいものリスト。11/2 オーナー「完全に分ける」「TOWN NOTE 仕様」）
        run: python3 scripts/lifenote.py
      - name: 公開する（Cloudflare Pages。鍵があるときだけ。アドレス lifenote.pages.dev と、前の usagi-life-notes.pages.dev にも同じ物）
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Cloudflareの鍵がまだないので公開しない"; exit 0; fi
          W="npx -y wrangler@3.80.0"
          $W pages project create usagi-life-notes --production-branch=main || true
          # 数える場所（KV）。なければ作る。作れないときは数えずに公開だけする
          ns=$(python3 scripts/pagestats.py ns | tail -1 || true)
          if [ -n "$ns" ]; then
            printf 'name = "usagi-life-notes"\npages_build_output_dir = "site"\ncompatibility_date = "2024-09-23"\n\n[[kv_namespaces]]\nbinding = "CLICKS"\nid = "%s"\n' "$ns" > wrangler.toml
            echo "数える場所あり"
          else echo "数える場所が見つからない。公開だけする"; fi
          $W pages deploy site --project-name=usagi-life-notes --branch=main --commit-dirty=true
          # 11/2 LIFE NOTE の新しいアドレスにも同じ物を出す（数える場所 KV も同じ。wrangler.toml の name だけ替える）
          if [ "$LIFE_BASE" != "https://usagi-life-notes.pages.dev" ]; then
            [ -f wrangler.toml ] && sed -i 's/^name = "usagi-life-notes"/name = "lifenote"/' wrangler.toml
            $W pages deploy site --project-name=lifenote --branch=main --commit-dirty=true || echo "lifenote に出せなかった"
          fi
          echo "NS=$ns" >> "$GITHUB_ENV"
      - name: 数えた数を読む（開いた数・押された数 → data/page-stats.json）
        if: env.NS != ''
        run: |
          rm -f wrangler.toml
          if [ "${{ inputs.reset }}" = "true" ]; then python3 scripts/pagestats.py reset "$NS" || true; else python3 scripts/pagestats.py "$NS" || true; fi
          git config user.name "akari-auto"
          git config user.email "akari-auto@users.noreply.github.com"
          git add data/page-stats.json data/link-ok.json data/townnotes-geo.json data/kansai-yado.json data/kanto-yado.json data/tanka.json data/furusato.json data/price-history.json data/nesage.json data/okaimono_img.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "ページの数とリンクの確かめを記録"
          # 公開用に書き換えた site/ のページ（ima.html など）は戻す（戻さないと pull できない）
          git checkout -- site 2>/dev/null || true
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
