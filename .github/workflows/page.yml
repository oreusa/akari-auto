name: page（プロフィール用ページを作って公開・1日4回）
on:
  schedule:
    - cron: "30 22 * * *"   # 7:30
    - cron: "30 3 * * *"    # 12:30
    - cron: "30 9 * * *"    # 18:30
    - cron: "30 13 * * *"   # 22:30
  workflow_dispatch:
permissions:
  contents: write   # 数えた数（data/page-stats.json）を保存する
concurrency:
  group: akari-page
  cancel-in-progress: true
jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      RAKUTEN_ORIGIN: ${{ vars.RAKUTEN_ORIGIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: ページを作る
        run: python3 scripts/page.py
      - name: 公開する（Cloudflare Pages。鍵があるときだけ。アドレス usagi-life-notes.pages.dev）
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Cloudflareの鍵がまだないので公開しない"; exit 0; fi
          W="npx -y wrangler@3.80.0"
          $W pages project create usagi-life-notes --production-branch=main || true
          # 数える場所（KV）。なければ作る。作れないときは数えずに公開だけする
          ns=$($W kv namespace list 2>/dev/null | python3 -c "import sys,json;t=sys.stdin.read();d=json.loads(t[t.find('['):]) if '[' in t else [];print(next((n['id'] for n in d if n.get('title')=='usagi-life-notes-clicks'),''))" || true)
          if [ -z "$ns" ]; then $W kv namespace create usagi-life-notes-clicks || true
            ns=$($W kv namespace list 2>/dev/null | python3 -c "import sys,json;t=sys.stdin.read();d=json.loads(t[t.find('['):]) if '[' in t else [];print(next((n['id'] for n in d if n.get('title')=='usagi-life-notes-clicks'),''))" || true); fi
          if [ -n "$ns" ]; then
            printf 'name = "usagi-life-notes"\npages_build_output_dir = "site"\ncompatibility_date = "2024-09-23"\n\n[[kv_namespaces]]\nbinding = "CLICKS"\nid = "%s"\n' "$ns" > wrangler.toml
            echo "数える場所あり"
          else echo "数える場所を作れない（鍵の権限に Workers KV Storage の編集が要る）。公開だけする"; fi
          $W pages deploy site --project-name=usagi-life-notes --branch=main --commit-dirty=true
          echo "NS=$ns" >> "$GITHUB_ENV"
      - name: 数えた数を読む（開いた数・押された数 → data/page-stats.json）
        if: env.NS != ''
        run: |
          rm -f wrangler.toml
          python3 scripts/pagestats.py "$NS" || true
          git config user.name "akari-auto"
          git config user.email "akari-auto@users.noreply.github.com"
          git add data/page-stats.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "ページの数を記録"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep $((i*5)); done
          exit 1
