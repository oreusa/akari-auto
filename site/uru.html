<script id="d" type="application/json">{"h1":"家を売る前に","sub":"この3つの順で進めると、迷いません。","html":"<section class=\"dsec\"><span class=\"dno\">1<\/span><h2>街の相場を見る<\/h2><p>あなたの街の地価の動き（国の地価公示）を見ます。<\/p>\n<div class=\"tqs\"><input class=\"din\" id=\"tq\" type=\"search\" placeholder=\"街の名前（例：川越市）\" autocomplete=\"off\" aria-label=\"街の名前で探す\"><div id=\"tqo\"><\/div><\/div><a class=\"dbtn2\" href=\"/ikura\" data-k=\"売る前に｜いくらで売れる\">種類と広さから、売れそうな値段の目安を出す（30秒）<\/a><\/section><section class=\"dsec\"><span class=\"dno\">2<\/span><h2>値段を聞く（無料）<\/h2><p>「いくらで売れそうか」を、無料のAI査定で見られます。売るか決めていなくても大丈夫です。<\/p>\n<a class=\"dbtn\" href=\"https://px.a8.net/svt/ejp?a8mat=4BGH3I+E2NY4I+5Y9M+5YJRM\" rel=\"nofollow sponsored noopener\" target=\"_blank\" data-k=\"売る前に｜AI査定\">いくらで売れそうか、AIで見る<small>無料・電話ラッシュなし（ざっくりAI査定＋）<\/small><\/a><img border=\"0\" width=\"1\" height=\"1\" src=\"https://www14.a8.net/0.gif?a8mat=4BGH3I+E2NY4I+5Y9M+5YJRM\" alt=\"\" style=\"position:absolute;width:1px;height:1px;opacity:0\"><p style=\"font-size:12px;color:#6B6058;margin-top:10px\">人に聞きたい方は <a href=\"/moushikomi?lite=1&amp;want=%E6%9F%BB%E5%AE%9A%E3%81%97%E3%81%A6%E3%81%BB%E3%81%97%E3%81%84\" data-k=\"売る前に｜申し込む\">こちら（名字だけでOK）<\/a><\/p><\/section><section class=\"dsec\"><span class=\"dno\">3<\/span><h2>大事なことを知っておく<\/h2>\n<details><summary>査定の額で売れるとは限らない<\/summary><div class=\"ddd\"><p>査定額は「この金額で売れます」というお約束ではありません。相場より高く売り出して売れ残り、値下げをくり返すと、「売れ残っている物件」と見られてしまうこともあります。<\/p><\/div><\/details><details><summary>住んでいた家なら、税金が軽くなることも<\/summary><div class=\"ddd\"><p>ご自身がお住まいだった家を売却されたときは、条件を満たせば、利益から最大3,000万円を差し引ける特例があります。ただし、確定申告が必要です（くわしくは国税庁・税務署にご確認ください）。<\/p><\/div><\/details><details><summary>売れた金額が、そのまま残るわけではない<\/summary><div class=\"ddd\"><p>ローンの残債、仲介手数料、登記や印紙の費用、税金を差し引いた額がお手元に残ります。売却の前に、「手取り額」を確認しておくことをおすすめします。<\/p><\/div><\/details><details><summary>権利証をなくしても売れる<\/summary><div class=\"ddd\"><p>権利証（登記識別情報）が見つからない場合でも、司法書士による本人確認などの手続きで売却することができます。<\/p><\/div><\/details><details><summary>住んだままでも売り出せる<\/summary><div class=\"ddd\"><p>お引っ越しの前でも、売り出すことができます。住み替えの場合は「売却が先か、購入が先か」で資金の段取りが変わるため、早めに決めておくことをおすすめします。<\/p><\/div><\/details><details><summary>仲介と買取のちがい<\/summary><div class=\"ddd\"><table class=\"cmp\"><thead><tr><th><\/th><th>仲介<small>買主さまを探して<br>売る方法<\/small><\/th><th>買取<small>不動産会社が<br>直接買い取る方法<\/small><\/th><\/tr><\/thead>\n<tbody>\n<tr><th scope=\"row\">期間<\/th><td>買主さまが見つかるまで、数か月ほどかかることが一般的です<\/td><td>早ければ数日から数週間で売却できます<\/td><\/tr>\n<tr><th scope=\"row\">価格<\/th><td>相場に近い価格を目指せます<\/td><td>相場より低くなることが一般的です<\/td><\/tr>\n<tr><th scope=\"row\">手数料<\/th><td>仲介手数料がかかります<\/td><td>仲介手数料はかかりません<\/td><\/tr>\n<tr><th scope=\"row\">こんな方に<\/th><td>時間をかけても、納得のいく価格で売りたい方<\/td><td>早く現金化したい方、近所に知られずに売りたい方<\/td><\/tr>\n<\/tbody><\/table><\/div><\/details><\/section><section class=\"dsec\"><h2>よくある質問<\/h2><details><summary>査定だけでも頼めますか？<\/summary><div class=\"ddd\"><p>はい。多くの不動産会社は、査定だけなら無料です。売るかどうかは、金額を見てから決められます。<\/p><\/div><\/details><details><summary>近所に知られずに売ることはできますか？<\/summary><div class=\"ddd\"><p>はい。広告を出さずに買主を探す方法や、不動産会社の買取で売る方法があります。不動産会社に希望を伝えて相談できます。<\/p><\/div><\/details><details><summary>費用はいつ、どのくらいかかりますか？<\/summary><div class=\"ddd\"><p>仲介手数料は、売買契約が成立したときに初めてかかります。上限は法律で決まっており、売買価格が400万円を超える場合は「売買価格×3％＋6万円」に消費税を加えた額が原則の上限です。売買価格が800万円以下の家・土地では、特例として、仲介の前に説明と合意があれば税込33万円まで受け取れる場合があります（<a href=\"https://www.mlit.go.jp/totikensangyo/const/content/001750229.pdf\" target=\"_blank\" rel=\"noopener\">国土交通省の告示<\/a>）。ほかに登記費用や印紙代などがかかります。<\/p><\/div><\/details><details><summary>遠方に住んでいても売れますか？<\/summary><div class=\"ddd\"><p>はい。電話やメール、郵送の手続きを組み合わせて、現地へ行く回数を少なくして進められることが多いです。現地の確認は、頼んだ不動産会社が行います。<\/p><\/div><\/details><details><summary>相続した家でも売れますか？<\/summary><div class=\"ddd\"><p>はい。売却の前に、相続登記（名義の変更）が必要です。2024年4月から相続登記は義務になりました。くわしくは法務局の案内をご覧ください。<\/p><\/div><\/details><details><summary>古い家は、解体してから売るほうがよいですか？<\/summary><div class=\"ddd\"><p>家の状態と場所によります。更地にすると買い手が見つかりやすいことがある一方で、解体の費用がかかり、土地の固定資産税の軽減が外れることがあります。市区によっては、古い家の解体に補助金が出ます。先に <a href=\"/kaitai-ranking\" data-k=\"売る前に｜解体の補助金ランキング\" style=\"color:inherit;font-weight:700\">関東の解体の補助金 上限ランキング<\/a> で、お住まいの市区の額と受付の状況をご確認ください。解体する前に、まずそのままの状態での査定をおすすめします。<\/p><\/div><\/details><details><summary>住宅ローンが残っていても売れますか？<\/summary><div class=\"ddd\"><p>はい。売却代金でローンを返済し、抵当権を抹消して引き渡す形が一般的です。売却額がローン残高に届かない場合は、借りている金融機関に相談します。<\/p><\/div><\/details><\/section><p class=\"dnote\">このページのリンクの一部は広告（PR）です。<\/p><section class=\"dsec\"><h2>あわせて見る<\/h2><div class=\"drel\"><a href=\"/fudosan-list\">家と土地の相場<small>関東の街ごとの値段<\/small><\/a><a href=\"/jikka/\">実家・空き家<small>売る・片付ける前に<\/small><\/a><a href=\"/ikura\">いくらで売れる？<small>30秒で目安<\/small><\/a><a href=\"/chika-kanto\">地価ランキング<small>住宅地の1年の動き<\/small><\/a><\/div><\/section>","js":"(function(){var F=\"direct\";try{F=sessionStorage.getItem(\"f\")||\"direct\";}catch(e){}function s(k){try{navigator.sendBeacon(\"/c?f=\"+encodeURIComponent(F)+\"&s=fudosan&k=\"+encodeURIComponent(String(k).slice(0,40)));}catch(e){}}document.addEventListener(\"click\",function(e){var a=e.target.closest&&e.target.closest(\"a\");if(!a)return;var t=a.querySelector(\".t\"),n=t?t.textContent:(a.childNodes[0]&&a.childNodes[0].textContent)||a.textContent;s(\"売る前に｜\"+n);},true);})();"}</script>
